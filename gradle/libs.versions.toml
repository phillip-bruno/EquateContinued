[versions]
agp = "9.4.1"
kotlin = "2.4.21"
material = "1.14.0"
preference = "1.2.1"
lifecycle = "2.11.0"
viewpager2 = "1.1.0"
constraintlayout = "2.2.2"
junit = "4.13.2"
mockito = "5.24.0"
json = "20260814"
guava = "33.7.2-jre"
androidxJunit = "1.3.0"
androidxTestRules = "1.7.0"
espresso = "3.7.0"

[libraries]
material = { module = "com.google.android.material:material", version.ref = "material" }
androidx-preference = { module = "androidx.preference:preference", version.ref = "preference" }
androidx-lifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel", version.ref = "lifecycle" }
androidx-lifecycle-livedata = { module = "androidx.lifecycle:lifecycle-livedata", version.ref = "lifecycle" }
androidx-viewpager2 = { module = "androidx.viewpager2:viewpager2", version.ref = "viewpager2" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintlayout" }

junit = { module = "junit:junit", version.ref = "junit" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
mockito-android = { module = "org.mockito:mockito-android", version.ref = "mockito" }
json = { module = "org.json:json", version.ref = "json" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxJunit" }
androidx-test-rules = { module = "androidx.test:rules", version.ref = "androidxTestRules" }
espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
espresso-contrib = { module = "androidx.test.espresso:espresso-contrib", version.ref = "espresso" }
espresso-idling-resource = { module = "androidx.test.espresso:espresso-idling-resource", version.ref = "espresso" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
